version: 2
updates:
  # Keeps the commit SHAs pinned in .github/workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      docs-site:
        patterns: ["*"]
